<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人教版数学教材知识图谱（小学1-6年级 + 初中7-9年级）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6f8;color:#1f2329;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:500;color:#111827;white-space:nowrap}
header .sub{font-size:12px;color:#6b7280}
.badge{font-size:11px;color:#374151;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;padding:3px 10px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:#f3f4f6;border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;padding:5px 14px;font-size:12px;border-radius:6px;cursor:pointer;color:#4b5563;font-family:inherit}
.tabs button.on{background:#fff;color:#111827;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
#controls{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
#controls label{color:#6b7280;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
#controls select,#controls input[type=text]{font-size:12px;padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#111827;font-family:inherit;outline:none}
#controls select:focus,#controls input[type=text]:focus{border-color:#6366f1}
#controls input[type=text]{width:190px}
.btn{font-size:12px;padding:4px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;cursor:pointer;font-family:inherit}
.btn:hover{background:#f3f4f6}
.btn.primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
.btn.primary:hover{background:#4338ca}
main{flex:1;display:flex;min-height:0}
#canvas-wrap{flex:1;position:relative;background:#fff;overflow:hidden}
svg#graph{width:100%;height:100%;display:block;cursor:grab}
svg#graph.panning{cursor:grabbing}
#hint{position:absolute;left:14px;bottom:10px;font-size:11px;color:#9ca3af;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:6px;border:1px solid #e5e7eb}
#legend{position:absolute;right:14px;bottom:10px;font-size:11px;color:#4b5563;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:8px;border:1px solid #e5e7eb;line-height:1.7}
#legend .row{display:flex;align-items:center;gap:6px}
#legend .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#legend .sw.rect{border-radius:2px}
#legend .sw.dia{width:8px;height:8px;transform:rotate(45deg);border-radius:1px}
#legend .ln{width:18px;height:0;border-top:2px solid #94a3b8;flex-shrink:0}
#legend .ln.soft{border-top-style:dashed;border-top-color:#cbd5e1}
#panel{width:350px;background:#fff;border-left:1px solid #e5e7eb;display:flex;flex-direction:column;min-height:0}
#panel.closed{width:0;border-left:0}
#panel-head{padding:12px 16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
#panel-head .t{font-size:13px;font-weight:500;color:#6b7280}
#panel-head button{border:0;background:#f3f4f6;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:#374151;font-family:inherit}
#panel-body{flex:1;overflow-y:auto;padding:14px 16px}
#panel-body .empty{color:#9ca3af;font-size:12px;line-height:1.8;text-align:center;margin-top:60px}
.pt{font-size:15px;font-weight:500;color:#111827;margin-bottom:2px;line-height:1.5}
.pmeta{font-size:11px;color:#6b7280;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.pmeta span{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:4px;padding:2px 6px}
.sec{margin:12px 0 4px;font-size:12px;font-weight:500;color:#374151}
.pdesc{font-size:12.5px;color:#374151;line-height:1.7}
.uli{font-size:12.5px;color:#374151;line-height:1.7;padding-left:18px}
.uli li{margin:2px 0}
.link-item{font-size:12.5px;padding:5px 8px;border:1px solid #e5e7eb;border-radius:6px;margin:3px 0;cursor:pointer;background:#fafafa;line-height:1.5}
.link-item:hover{border-color:#a5b4fc;background:#f5f5ff}
.link-item .s{font-size:10.5px;color:#9ca3af}
.link-item .r{font-size:11px;color:#6b7280;margin-top:1px}
.req{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;margin-right:4px}
.req.hard{background:#fee2e2;color:#b91c1c}
.req.soft{background:#e0e7ff;color:#3730a3}
.path-list{font-size:12px;color:#374151;line-height:1.8}
.path-list .step{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed #f3f4f6}
.path-list .num{color:#6366f1;font-size:11px;min-width:18px;text-align:right}
.path-list .cur{color:#b45309;font-weight:500}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:4px;margin-right:5px}
.tag.CONCEPTUAL{background:#e0e7ff;color:#3730a3}
.tag.PROCEDURAL{background:#dcfce7;color:#166534}
.tag.REPRESENTATIONAL{background:#fef3c7;color:#92400e}
.tooltip{position:fixed;background:#111827;color:#f9fafb;font-size:11.5px;padding:5px 10px;border-radius:6px;pointer-events:none;z-index:99;display:none;max-width:260px;line-height:1.5}
@media (max-width:900px){#panel{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.12)}}
</style>
</head>
<body>
<header>
  <h1>人教版数学教材知识图谱</h1>
  <span class="sub">小学 1-6 年级 + 初中 7-9 年级 · 全 18 册</span>
  <span class="badge" id="statTotal">-</span>
  <span class="badge" id="statView">-</span>
  <div class="tabs" id="stageTabs">
    <button data-stage="all" class="on">全部</button>
    <button data-stage="primary">小学</button>
    <button data-stage="junior">初中</button>
  </div>
</header>
<div id="controls">
  <label>册次 <select id="selVol"><option value="all">全部册次</option></select></label>
  <label>领域 <select id="selDomain"><option value="all">全部领域</option></select></label>
  <label>类型 <select id="selType">
    <option value="all">全部类型</option>
    <option value="CONCEPTUAL">概念理解</option>
    <option value="PROCEDURAL">程序计算</option>
    <option value="REPRESENTATIONAL">表征图示</option>
  </select></label>
  <input type="text" id="search" placeholder="搜索知识点名称 / 描述…">
  <button class="btn primary" id="btnFit">适配视图</button>
  <button class="btn" id="btnPanel">收起详情</button>
  <label><input type="checkbox" id="ckSoft" checked>显示软依赖</label>
</div>
<main>
  <div id="canvas-wrap">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg">
      <g id="viewport"></g>
    </svg>
    <div id="hint">滚轮缩放 · 拖拽平移 · 点击节点查看详情 · 双击空白适配视图</div>
    <div id="legend">
      <div class="row"><span class="sw" style="background:#4f46e5"></span> 概念理解</div>
      <div class="row"><span class="sw rect" style="background:#059669"></span> 程序计算</div>
      <div class="row"><span class="sw dia" style="background:#d97706"></span> 表征图示</div>
      <div class="row"><span class="ln"></span> 硬依赖（必须先学）</div>
      <div class="row"><span class="ln soft"></span> 软依赖（建议先学）</div>
    </div>
  </div>
  <div id="panel">
    <div id="panel-head"><span class="t">知识点详情</span><button id="btnClosePanel">关闭</button></div>
    <div id="panel-body"><div class="empty">点击图中的任意知识点节点<br>查看详细内容、前置与后续知识</div></div>
  </div>
</main>
<div class="tooltip" id="tooltip"></div>
<script>
const GRAPH = {"topics":[{"id":"mt_g1u_001","name":"1~5各数的认识","type":"CONCEPTUAL","domain":"数的认识","description":"认识1到5各数，会数数、写数字，理解每个数的含义，在数轴上表示0~5。","evidence":["p14-15：数一数、写一写，数轴表示1~5"],"assessmentPrompt":"给你5个苹果，请告诉我一共有几个，并写出这个数字。","centrality":0.95,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.1.1"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_002","name":"0的认识","type":"CONCEPTUAL","domain":"数的认识","description":"认识0，理解0表示没有，以及0在数轴上的位置；知道a-a=0，a+0=a。","evidence":["p30：0的认识和加减法，a-a=0，a+0=a"],"assessmentPrompt":"盘子里有3个橘子，吃掉3个，还剩几个？用算式表示。","centrality":0.9,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.1.2"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_003","name":"比大小（=、>、<）","type":"CONCEPTUAL","domain":"数的认识","description":"用一一对应的方法比较两个数的大小，认识=、>、<符号，能正确使用比大小符号。","evidence":["p17：比大小，一一对应，=、>、<符号"],"assessmentPrompt":"在○里填上>、<或=：3○5，4○4，2○1。","centrality":0.85,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.1.3"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_004","name":"第几（序数与基数的区分）","type":"CONCEPTUAL","domain":"数的认识","description":"区分序数（第几个）与基数（几个），能正确回答排列中某物体的位置。","evidence":["p19：第几，序数与基数的区别"],"assessmentPrompt":"5只小动物排成一排，从左数小兔排第3，从右数小兔排第几？","centrality":0.75,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.1.4"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_005","name":"数的分与合（5以内）","type":"CONCEPTUAL","domain":"数的认识","description":"理解2、3、4、5的分与合，能说出一个数可以分成哪两个数，以及两个数合起来是几。","evidence":["p20-21：分与合，2、3、4、5的分拆"],"assessmentPrompt":"5可以分成2和几？把答案填在□里：5=2+□。","centrality":0.9,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.1.5"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_006","name":"6~9各数的认识","type":"CONCEPTUAL","domain":"数的认识","description":"认识6到9各数，会数数、写数字，理解数的大小顺序，在数轴上表示0~9。","evidence":["p36-37：6~9的认识，数轴0~9"],"assessmentPrompt":"从6数到9，写出这四个数字。","centrality":0.9,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.2.1"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_007","name":"6~9的分与合","type":"CONCEPTUAL","domain":"数的认识","description":"掌握6、7、8、9各数的分与合，为相应加减法奠定基础。","evidence":["p39-41：6、7、8、9的分与合"],"assessmentPrompt":"8可以分成哪两个数？至少说出3种分法。","centrality":0.85,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.2.2"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_008","name":"10的认识与10的分与合","type":"CONCEPTUAL","domain":"数的认识","description":"认识10，理解10的分与合（1+9, 2+8, 3+7, 4+6, 5+5等互补数对），认识10个一等于10。","evidence":["p54-56：10的认识，10的分与合，互补数对"],"assessmentPrompt":"10可以分成哪些数对？把所有分法写出来。","centrality":0.95,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.2.3"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_009","name":"11~20各数的认识与位值","type":"CONCEPTUAL","domain":"数的认识","description":"认识11~20各数，理解十位和个位的含义，知道10个一是1个十，用计数器表示两位数。","evidence":["p73-80：11~20认识，十位个位，计数器，10个一=1个十"],"assessmentPrompt":"15这个数，十位上是几？个位上是几？15是由几个十和几个一组成的？","centrality":0.95,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.4.1"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_010","name":"双数与单数","type":"CONCEPTUAL","domain":"数的认识","description":"初步认识双数（偶数）和单数（奇数）的概念，能判断20以内数的奇偶性。","evidence":["p80：数学知识，双数/单数"],"assessmentPrompt":"1到10中，哪些是双数？哪些是单数？","centrality":0.6,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.4.2"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_011","name":"5以内加法","type":"PROCEDURAL","domain":"数的运算","description":"认识加号+，理解加法含义（合并），计算5以内加法，如3+1=4，3+2=5，会用数数法求和。","evidence":["p24-25：加法，+号，3+1=4，3+2=5，数数法"],"assessmentPrompt":"2+3=□，用小棒摆一摆，再填出答案。","centrality":0.95,"ageRangeStart":6,"ageRangeEnd":7,"standards":["pep-math-2022:1上.1.6"],"vol":"1-up","stage":"primary","grade":1},{"id":"mt_g1u_012","name":"5以内减法","type":"PROCEDURAL","domain":"数的运算","description":"认识减号-，理解减法含义（去掉），计算5以内减法，如4-1=3，用数数法求差。","evidence":["p26-27：减法，-号，4-1=3，数数法"],"assessmentPrompt":"5-2=□，画图或用小棒表示，再填出答案。","centrality" <script>
const T = GRAPH.topics, D = GRAPH.deps;
const byId = new Map(T.map(t => [t.id, t]));
const volNames = GRAPH.volNames, volOrder = GRAPH.volOrder;
const children = new Map(), parents = new Map();
T.forEach(t => { children.set(t.id, []); parents.set(t.id, []); });
D.forEach(d => {
  if (children.has(d.prerequisiteId)) children.get(d.prerequisiteId).push(d);
  if (parents.has(d.topicId)) parents.get(d.topicId).push(d);
});
const PALETTE = ['#4f46e5','#0ea5e9','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#ca8a04','#db2777','#65a30d','#2563eb','#ea580c','#16a34a','#9333ea','#0d9488','#b45309'];
function colorOf(domain) {
  let h = 0;
  for (const c of String(domain)) h = (h * 31 + c.charCodeAt(0)) % 997;
  return PALETTE[h % PALETTE.length];
}
const TYPE_SHAPE = { CONCEPTUAL: 'circle', PROCEDURAL: 'rect', REPRESENTATIONAL: 'dia' };

const $ = id => document.getElementById(id);
const svg = $('graph'), vp = $('viewport');
let stage = 'all', vol = 'all', domain = 'all', type = 'all', query = '', showSoft = true;
let selected = null;
let cam = { x: 30, y: 30, z: 1 };

$('statTotal').textContent = '总数据：' + T.length + ' 知识点 · ' + D.length + ' 依赖边';

function currentTopics() {
  const q = query.trim().toLowerCase();
  return T.filter(t => {
    if (stage !== 'all' && t.stage !== stage) return false;
    if (vol !== 'all' && t.vol !== vol) return false;
    if (domain !== 'all' && t.domain !== domain) return false;
    if (type !== 'all' && t.type !== type) return false;
    if (q && !(t.name.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q))) return false;
    return true;
  });
}
function currentDeps(idSet) {
  return D.filter(d => idSet.has(d.topicId) && idSet.has(d.prerequisiteId) && (showSoft || d.strength !== 'soft'));
}

let pos = new Map(); let layoutW = 0, layoutH = 0; let colCount = 0;

function computeLayout(ids) {
  pos = new Map();
  const col = new Map();
  function calc(id) {
    if (col.has(id)) return col.get(id);
    const ps = (parents.get(id) || []).filter(d => ids.has(d.prerequisiteId));
    if (!ps.length) { col.set(id, 0); return 0; }
    let m = -1;
    ps.forEach(d => m = Math.max(m, calc(d.prerequisiteId)));
    col.set(id, m + 1); return m + 1;
  }
  ids.forEach(calc);
  const cols = {};
  col.forEach((c, id) => { (cols[c] = cols[c] || []).push(id); });
  colCount = Math.max(...Object.keys(cols).map(Number)) + 1;
  for (let it = 0; it < 3; it++) {
    for (let c = 1; c < colCount; c++) {
      const arr = cols[c] || [];
      const sc = new Map();
      arr.forEach(id => {
        const p = (parents.get(id) || []).filter(d => ids.has(d.prerequisiteId));
        if (!p.length) { sc.set(id, 0); return; }
        const r = p.map(d => (cols[col.get(d.prerequisiteId)] || []).indexOf(d.prerequisiteId)).filter(r => r >= 0);
        sc.set(id, r.length ? r.reduce((a, b) => a + b, 0) / r.length : 0);
      });
      arr.sort((a, b) => sc.get(a) - sc.get(b));
    }
  }
  const XG = 210, YG = 48;
  let maxY = 0;
  for (let c = 0; c < colCount; c++) {
    const arr = cols[c] || [];
    const th = (arr.length - 1) * YG;
    arr.forEach((id, i) => pos.set(id, { x: c * XG, y: i * YG - th / 2 }));
    if (arr.length) maxY = Math.max(maxY, th + YG);
  }
  layoutW = (colCount - 1) * XG + 200;
  layoutH = Math.max(maxY, 100);
  return cols;
}

function ancestors(id) {
  const res = new Set([id]), stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    (parents.get(cur) || []).forEach(d => {
      if (!res.has(d.prerequisiteId)) { res.add(d.prerequisiteId); stack.push(d.prerequisiteId); }
    });
  }
  return res;
}
function descendants(id) {
  const res = new Set([id]), stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    (children.get(cur) || []).forEach(d => {
      if (!res.has(d.topicId)) { res.add(d.topicId); stack.push(d.topicId); }
    });
  }
  return res;
}
function topoOrder(ids) {
  const inDeg = new Map();
  ids.forEach(id => inDeg.set(id, 0));
  const adj = new Map();
  ids.forEach(id => adj.set(id, []));
  D.forEach(d => {
    if (ids.has(d.topicId) && ids.has(d.prerequisiteId)) {
      adj.get(d.prerequisiteId).push(d.topicId);
      inDeg.set(d.topicId, (inDeg.get(d.topicId) || 0) + 1);
    }
  });
  const q = [...ids].filter(id => inDeg.get(id) === 0);
  const order = [];
  while (q.length) {
    q.sort((a, b) => (byId.get(a).volOrderIdx || 0) - (byId.get(b).volOrderIdx || 0));
    const n = q.shift();
    order.push(n);
    (adj.get(n) || []).forEach(nxt => {
      inDeg.set(nxt, inDeg.get(nxt) - 1);
      if (inDeg.get(nxt) === 0) q.push(nxt);
    });
  }
  ids.forEach(id => { if (!order.includes(id)) order.push(id); });
  return order;
}

const NS = 'http://www.w3.org/2000/svg';
function el(name, attrs) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

let preSet = new Set(), postSet = new Set();
function render() {
  vp.innerHTML = '';
  const ids = new Set(currentTopics().map(t => t.id));
  const deps = currentDeps(ids);
  if (!ids.size) {
    $('statView').textContent = '当前视图：0 知识点 · 0 依赖边';
    return;
  }
  computeLayout(ids);
  $('statView').textContent = '当前视图：' + ids.size + ' 知识点 · ' + deps.length + ' 依赖边 · ' + colCount + ' 层';
  if (selected && !ids.has(selected)) selected = null;
  preSet = selected ? ancestors(selected) : new Set();
  postSet = selected ? descendants(selected) : new Set();
  const shown = new Set();
  deps.forEach(d => { shown.add(d.topicId); shown.add(d.prerequisiteId); });
  deps.forEach(d => {
    const p = pos.get(d.prerequisiteId), q = pos.get(d.topicId);
    if (!p || !q) return;
    const x1 = p.x + 16, y1 = p.y, x2 = q.x - 16, y2 = q.y;
    const mx = (x1 + x2) / 2;
    const isPre = selected && preSet.has(d.topicId) && preSet.has(d.prerequisiteId);
    const isPost = selected && postSet.has(d.topicId) && postSet.has(d.prerequisiteId);
    const hard = d.strength !== 'soft';
    let stroke = '#c3c9d4', width = 1.1;
    if (selected) {
      if (isPre) { stroke = '#d97706'; width = 1.8; }
      else if (isPost) { stroke = '#2563eb'; width = 1.8; }
    } else if (hard) { stroke = '#aab2c0'; }
    const line = el('path', {
      d: 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2,
      fill: 'none', stroke, 'stroke-width': width,
      'stroke-dasharray': hard ? '' : '5,4',
      opacity: selected && !isPre && !isPost ? 0.18 : 0.85
    });
    vp.appendChild(line);
  });
  ids.forEach(id => {
    const t = byId.get(id), p = pos.get(id);
    if (!p) return;
    const c = colorOf(t.domain);
    const cx = p.x, cy = p.y;
    const isSel = selected === id;
    const isPre = selected && preSet.has(id) && id !== selected;
    const isPost = selected && postSet.has(id) && id !== selected;
    const faded = selected && !isSel && !isPre && !isPost;
    const shape = TYPE_SHAPE[t.type] || 'circle';
    const g = el('g', { transform: 'translate(' + cx + ',' + cy + ')', class: 'node', style: 'cursor:pointer' });
    g.setAttribute('data-id', id);
    let body;
    if (shape === 'rect') {
      body = el('rect', { x: -8, y: -8, width: 16, height: 16, rx: 4 });
    } else if (shape === 'dia') {
      body = el('path', { d: 'M0,-10 L10,0 L0,10 L-10,0 Z' });
    } else {
      body = el('circle', { r: 9 });
    }
    let fill = c, fillOp = 0.28, stroke = c, sw = 1.5;
    if (isSel) { fill = '#f59e0b'; fillOp = 0.35; stroke = '#b45309'; sw = 3; }
    else if (isPre) { stroke = '#d97706'; sw = 2.5; }
    else if (isPost) { stroke = '#2563eb'; sw = 2.5; }
    body.setAttribute('fill', fill);
    body.setAttribute('fill-opacity', fillOp);
    body.setAttribute('stroke', stroke);
    body.setAttribute('stroke-width', sw);
    g.appendChild(body);
    const label = el('text', {
      x: 15, y: 0, 'font-size': 12, fill: '#1f2329',
      'dominant-baseline': 'central',
      opacity: faded ? 0.3 : 0.9,
      style: 'pointer-events:none'
    });
    label.textContent = t.name;
    g.appendChild(label);
    g.addEventListener('click', ev => { ev.stopPropagation(); select(id); });
    g.addEventListener('mousemove', ev => showTip(ev, t));
    g.addEventListener('mouseleave', () => { $('tooltip').style.display = 'none'; });
    vp.appendChild(g);
  });
  applyCam(true);
}

function showTip(ev, t) {
  const tip = $('tooltip');
  tip.innerHTML = '<b>' + t.name + '</b><br>' + volNames[t.vol] + ' · ' + t.domain;
  tip.style.display = 'block';
  tip.style.left = (ev.clientX + 14) + 'px';
  tip.style.top = (ev.clientY + 14) + 'px';
}
function applyCam(instant) {
  vp.setAttribute('transform', 'translate(' + cam.x + ',' + cam.y + ') scale(' + cam.z + ')');
}
function fit() {
  const wrap = $('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!layoutW) return;
  const z = Math.min((w - 60) / layoutW, (h - 60) / layoutH, 1.4);
  cam.z = Math.max(z, 0.15);
  cam.x = (w - layoutW * cam.z) / 2;
  cam.y = (h - layoutH * cam.z) / 2;
  applyCam();
}

let drag = null;
svg.addEventListener('mousedown', ev => {
  if (ev.target !== svg) return;
  drag = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y };
  svg.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if (drag) {
    cam.x = drag.cx + (ev.clientX - drag.x);
    cam.y = drag.cy + (ev.clientY - drag.y);
    applyCam();
  }
});
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('panning'); });
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  const nz = Math.min(Math.max(cam.z * f, 0.12), 3);
  cam.x = mx - (mx - cam.x) * (nz / cam.z);
  cam.y = my - (my - cam.y) * (nz / cam.z);
  cam.z = nz;
  applyCam();
}, { passive: false });
svg.addEventListener('dblclick', ev => {
  if (ev.target === svg) fit();
});

function select(id) {
  selected = (selected === id) ? null : id;
  if (selected) renderPanel(selected);
  else { $('panel-body').innerHTML = '<div class="empty">点击图中的任意知识点节点<br>查看详细内容、前置与后续知识</div>'; }
  render();
}
function volIdx(v) { return volOrder.indexOf(v); }
T.forEach(t => t.volOrderIdx = volIdx(t.vol));

function linkHtml(d, dir) {
  const t = byId.get(dir === 'pre' ? d.prerequisiteId : d.topicId);
  const st = d.strength === 'soft' ? 'soft' : 'hard';
  const stCn = st === 'soft' ? '软依赖' : '硬依赖';
  const r = d.reason ? '<div class="r">' + d.reason + '</div>' : '';
  return '<div class="link-item" onclick="select(\'' + t.id + '\')">' +
    '<span class="req ' + st + '">' + stCn + '</span>' + t.name +
    '<span class="s"> · ' + volNames[t.vol] + '</span>' + r + '</div>';
}
function pathHtml(id) {
  const ids = ancestors(id);
  const order = topoOrder(ids);
  let h = '<div class="path-list">';
  order.forEach((nid, i) => {
    const t = byId.get(nid);
    const cls = nid === id ? ' class="cur"' : '';
    h += '<div class="step"><span class="num">' + (i + 1) + '</span><span' + cls + '>' + t.name +
      '<span class="s" style="color:#9ca3af;font-size:10.5px"> · ' + volNames[t.vol] + '</span></span></div>';
  });
  h += '</div>';
  return h;
}
function renderPanel(id) {
  const t = byId.get(id);
  const body = $('panel-body');
  let h = '<div class="pt">' + t.name + '</div>';
  h += '<div class="pmeta"><span>' + volNames[t.vol] + '</span><span>' + t.domain + '</span>' +
    '<span class="tag ' + t.type + '">' + (GRAPH.typeCn[t.type] || t.type) + '</span>' +
    '<span>第' + t.grade + '学段' + (t.grade <= 6 ? ' · 小学' : ' · 初中') + '</span>' +
    (t.ageRangeStart ? '<span>' + t.ageRangeStart + '-' + t.ageRangeEnd + ' 岁</span>' : '') +
    (t.centrality ? '<span>中心度 ' + t.centrality + '</span>' : '') + '</div>';
  if (t.description) { h += '<div class="sec">知识点描述</div><div class="pdesc">' + t.description + '</div>'; }
  if (t.evidence && t.evidence.length) {
    h += '<div class="sec">掌握标准 / 教材出处</div><ul class="uli">' + t.evidence.map(e => '<li>' + e + '</li>').join('') + '</ul>';
  }
  if (t.assessmentPrompt) { h += '<div class="sec">考核提示</div><div class="pdesc">' + t.assessmentPrompt.replace(/\{\{name\}\}/g, '孩子') + '</div>'; }
  if (t.standards && t.standards.length) { h += '<div class="sec">课标对齐</div><div class="pdesc" style="font-size:11.5px;color:#6b7280">' + t.standards.join('、') + '</div>'; }
  const ps = (parents.get(id) || []).filter(d => byId.has(d.prerequisiteId));
  const cs = (children.get(id) || []).filter(d => byId.has(d.topicId));
  h += '<div class="sec">前置知识（' + ps.length + '）</div>' + (ps.length ? ps.map(d => linkHtml(d, 'pre')).join('') : '<div class="pdesc" style="color:#9ca3af">无，属于基础起点</div>');
  h += '<div class="sec">后续知识（' + cs.length + '）</div>' + (cs.length ? cs.map(d => linkHtml(d, 'post')).join('') : '<div class="pdesc" style="color:#9ca3af">无后续，属于该链终点</div>');
  h += '<div style="margin-top:14px"><button class="btn primary" style="width:100%;padding:7px" onclick="this.nextElementSibling.style.display=\'block\';renderPath(\'' + id + '\')">生成学习路径（从基础到本知识点）</button><div style="display:none;margin-top:8px" id="pathBox"><div class="sec">推荐学习顺序</div>' + pathHtml(id) + '</div></div>';
  body.innerHTML = h;
  body.scrollTop = 0;
}
function renderPath(id) {
  const box = document.getElementById('pathBox');
  if (box) box.innerHTML = '<div class="sec">推荐学习顺序</div>' + pathHtml(id);
}

function refreshVolOptions() {
  const sel = $('selVol');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">全部册次</option>';
  volOrder.forEach(v => {
    const st = v <= '6-down' ? 'primary' : 'junior';
    if (stage === 'all' || stage === st) {
      const o = document.createElement('option');
      o.value = v; o.textContent = volNames[v];
      sel.appendChild(o);
    }
  });
  sel.value = volOrder.includes(cur) && (stage === 'all' || (cur <= '6-down' ? 'primary' : 'junior') === stage) ? cur : 'all';
  refreshDomainOptions();
}
function refreshDomainOptions() {
  const sel = $('selDomain');
  const cur = sel.value;
  const ts = currentTopics();
  const doms = [...new Set(ts.map(t => t.domain))].sort();
  sel.innerHTML = '<option value="all">全部领域</option>';
  doms.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
  sel.value = doms.includes(cur) ? cur : 'all';
}
function refresh() { refreshVolOptions(); render(); }

$('stageTabs').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  document.querySelectorAll('#stageTabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  stage = b.dataset.stage;
  refresh();
});
$('selVol').addEventListener('change', ev => { vol = ev.target.value; refreshDomainOptions(); render(); });
$('selDomain').addEventListener('change', ev => { domain = ev.target.value; render(); });
$('selType').addEventListener('change', ev => { type = ev.target.value; render(); });
$('ckSoft').addEventListener('change', ev => { showSoft = ev.target.checked; render(); });
let st = null;
$('search').addEventListener('input', ev => {
  clearTimeout(st);
  st = setTimeout(() => { query = ev.target.value; render(); }, 280);
});
$('btnFit').addEventListener('click', fit);
$('btnPanel').addEventListener('click', () => {
  $('panel').classList.toggle('closed');
  $('btnPanel').textContent = $('panel').classList.contains('closed') ? '展开详情' : '收起详情';
});
$('btnClosePanel').addEventListener('click', () => {
  $('panel').classList.add('closed');
  $('btnPanel').textContent = '展开详情';
});
window.addEventListener('resize', () => { applyCam(); });

refresh();
fit();
</script>
