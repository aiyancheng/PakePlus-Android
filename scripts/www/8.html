<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱眼城眼镜 · 套餐导航</title>
<style>
  :root {
    --blue: #1677ff;
    --blue-light: #e6f4ff;
    --teal: #0891b2;
    --teal-light: #ecfeff;
    --orange: #ed8936;
    --orange-light: #fff7ed;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --text: #1a1a2e;
    --text-secondary: #555;
    --text-light: #888;
    --border: #e5e7eb;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, #f0f7ff 0%, #e8ecf1 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 16px 50px;
    color: var(--text);
  }

  .page {
    width: 100%;
    max-width: 820px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    padding: 40px 36px 44px;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 2px dashed var(--border);
  }
  .header .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .header .logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1677ff, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, #1677ff, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* 卡片网格 */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 24px;
  }

  /* 套餐卡片 */
  .nav-card {
    display: flex;
    flex-direction: column;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
    background: #fff;
  }
  .nav-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.12);
  }

  /* 卡片色条 */
  .nav-card .card-strip {
    height: 6px;
  }
  .nav-card .card-strip.strip-a { background: linear-gradient(90deg, #1677ff, #6366f1); }
  .nav-card .card-strip.strip-b { background: linear-gradient(90deg, #f97316, #ef4444); }
  .nav-card .card-strip.strip-c { background: linear-gradient(90deg, #10b981, #06b6d4); }
  .nav-card .card-strip.strip-d { background: linear-gradient(90deg, #08b2a8, #a855f7); }

  /* 卡片内容 */
  .nav-card .card-body {
    padding: 20px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .nav-card .card-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .nav-card .card-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--text);
  }
  .nav-card .card-desc {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.6;
    flex: 1;
  }
  .nav-card .card-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    transition: gap 0.2s;
  }
  .nav-card:hover .card-link {
    gap: 8px;
  }

  /* 页脚 */
  .footer {
    text-align: center;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer .clinic-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
  }
  .footer .clinic-info {
    font-size: 11px;
    color: var(--text-light);
    line-height: 1.6;
  }

  /* 响应式 */
  @media (max-width: 640px) {
    body {
      padding: 0;
    }
    .page {
      max-width: 100%;
      border-radius: 0;
      padding: 24px 14px 28px;
    }
    .card-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .header h1 {
      font-size: 22px;
    }
  }

  /* 打印 */
  @media print {
    body {
      background: #fff;
      padding: 0;
    }
    .page {
      box-shadow: none;
      border-radius: 0;
    }
    .nav-card {
      break-inside: avoid;
    }
  }

  /* 返回首页 */
  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #1677ff;
    background: #f0f5ff;
    border-radius: 20px;
    text-decoration: none;
    transition: background 0.2s;
  }
  .back-home:hover { background: #dbe4ff; }
</style>
</head>
