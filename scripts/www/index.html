        .filter-tab:hover {

                            ]
                        },
                        {
                            id: 'week11-12',
                            name: '第11-12周',
                            daysRange: '第341-354天',
                            days: [
                                {day: 341, topic: '仪容仪表：发型/妆容/指甲'},
                                {day: 342, topic: '服务用语：标准与禁忌清单'},
                                {day: 343, topic: '肢体语言：站姿/坐姿/手势'},
                                {day: 344, topic: '个人卫生：口腔/体味/服装'},
                                {day: 345, topic: '工作服：整洁与规范穿着'},
                                {day: 346, topic: '名牌佩戴：位置与样式'},
                                {day: 347, topic: '服务禁忌：20条红线'},
                                {day: 348, topic: '门店环境：5S管理标准'},
                                {day: 349, topic: '收银礼仪：速度/准确/微笑'},
                                {day: 350, topic: '电话礼仪：接听/转接/挂断'},
                                {day: 351, topic: '迎送礼仪：门口/电梯/停车场'},
                                {day: 352, topic: '饮品服务：主动与适度'},
                                {day: 353, topic: '儿童关怀：安全与趣味'},
                                {day: 354, topic: '特殊顾客：轮椅/视障/听障'}
                            ]
                        },
                        {
                            id: 'week13-14',
                            name: '第13-14周',
                            daysRange: '第355-365天',
                            days: [
                                {day: 355, topic: '职业素养：诚信/专业/责任'},
                                {day: 356, topic: '时间管理：四象限法则'},
                                {day: 357, topic: '压力管理：识别与疏导'},
                                {day: 358, topic: '持续学习：知识更新路径'},
                                {day: 359, topic: '职业规划：店员→店长→区域'},
                                {day: 360, topic: '行业趋势：数字化/个性化/预防'},
                                {day: 361, topic: '365天培训总结与毕业典礼'},
                                {day: 362, topic: '晋级考核：理论+实操'},
                                {day: 363, topic: '未来展望：个人与门店共成长'},
                                {day: 364, topic: '培训反馈收集与课程优化'},
                                {day: 365, topic: '校友网络：持续交流与互助'}
                            ]
                        }
                    ]
                }
            ]
        };

        let currentModule = 'all';
        let searchKeyword = '';

        // ========== 渲染模块手风琴 ==========
        function renderModules() {
            const accordion = document.getElementById('moduleAccordion');
            accordion.innerHTML = '';
            
            trainingData.modules.forEach(module => {
                // 检查模块是否匹配筛选
                if (currentModule !== 'all' && module.name !== currentModule) return;
                
                // 检查模块内是否有匹配搜索的天数
                const matchedWeeks = module.weeks.filter(week => {
                    return week.days.some(day => {
                        const matchesSearch = !searchKeyword || 
                            day.topic.toLowerCase().includes(searchKeyword) || 
                            day.day.toString().includes(searchKeyword);
                        return matchesSearch;
                    });
                });
                
                if (matchedWeeks.length === 0 && searchKeyword) return;
                
                // 创建模块头部
                const moduleHeader = document.createElement('div');
                moduleHeader.className = 'module-header';
                moduleHeader.innerHTML = `
                    <div>
                        <div class="module-title">📦 ${module.name}</div>
                        <div class="module-meta">${module.daysRange} · 共${module.totalDays}天</div>
                    </div>
                    <div class="module-arrow">▼</div>
                `;
                moduleHeader.addEventListener('click', () => toggleModule(moduleHeader));
                
                // 创建周手风琴容器
                const weekAccordion = document.createElement('div');
                weekAccordion.className = 'week-accordion';
                
                // 渲染周
                matchedWeeks.forEach(week => {
                    const weekHeader = document.createElement('div');
                    weekHeader.className = 'week-header';
                    weekHeader.innerHTML = `
                        <div>
                            <div class="week-title">📅 ${week.name}</div>
                            <div class="week-meta">${week.daysRange}</div>
                        </div>
                        <div class="week-arrow">▼</div>
                    `;
                    weekHeader.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleWeek(weekHeader);
                    });
                    
                    // 创建天数网格
                    const daysGrid = document.createElement('div');
                    daysGrid.className = 'days-grid';
                    
                        week.days.forEach(day => {
                        const matchesSearch = !searchKeyword || 
                            day.topic.toLowerCase().includes(searchKeyword) || 
                            day.day.toString().includes(searchKeyword);
                        
                        if (!matchesSearch) return;
                        
                        const card = document.createElement('a');
                        card.className = 'day-card';
                        card.href = `day${String(day.day).padStart(3,'0')}.html`;
                        card.innerHTML = `
                            <span class="day-num">第${day.day}天</span>
                            <span class="day-topic">${day.topic}</span>
                            <span class="day-week">${week.name}</span>
                        `;
                        daysGrid.appendChild(card);
                    });
                    
                    weekAccordion.appendChild(weekHeader);
                    weekAccordion.appendChild(daysGrid);
                });
                
                accordion.appendChild(moduleHeader);
                accordion.appendChild(weekAccordion);
            });
            
            // 显示/隐藏无结果提示
            const noResult = document.getElementById('noResult');
            noResult.style.display = accordion.children.length === 0 ? 'block' : 'none';
            
            // 默认展开第一个模块
            const firstModuleHeader = accordion.querySelector('.module-header');
            if (firstModuleHeader && currentModule !== 'all') {
                firstModuleHeader.classList.add('collapsed');
                toggleModule(firstModuleHeader);
            }
        }

        // ========== 切换模块展开/折叠 ==========
        function toggleModule(header) {
            const isCollapsed = header.classList.contains('collapsed');
            const weekAccordion = header.nextElementSibling;
            
            if (isCollapsed) {
                header.classList.remove('collapsed');
                weekAccordion.style.display = 'block';
            } else {
                header.classList.add('collapsed');
                weekAccordion.style.display = 'none';
            }
        }

        // ========== 切换周展开/折叠 ==========
        function toggleWeek(header) {
            const isCollapsed = header.classList.contains('collapsed');
            const daysGrid = header.nextElementSibling;
            
            if (isCollapsed) {
                header.classList.remove('collapsed');
                daysGrid.style.display = 'grid';
            } else {
                header.classList.add('collapsed');
                daysGrid.style.display = 'none';
            }
        }

        // ========== 切换模块筛选 ==========
        function switchModule(module, btn) {
            currentModule = module;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderModules();
        }

        // ========== 搜索过滤 ==========
        function filterDays() {
            searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            renderModules();
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderModules();
        });
    </script>
</body>
</html>
