<style>
  /* ========== BASE ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8;
    --panel: #ffffff;
    --card: #f1f5f9;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #64748b;
    --accent: #1677ff;

    --c-strategy: #1677ff;  /* 蓝 战略 */
    --c-marketing: #fa8c16; /* 橙 营销 */
    --c-ops: #13c2c2;      /* 绿 运营 */
    --c-medical: #722ed1;   /* 紫 医疗 */
    --c-growth: #d48806;    /* 金 增长 */

    --center-size: 120px;
    --branch-r: 210px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* ========== TOPBAR ========== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 52px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
  }
  .topbar-logo { font-size: 15px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .topbar-tip { font-size: 12px; color: var(--muted); }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .btn-sm {
    padding: 5px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    transition: all .2s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ========== LEGEND ========== */
  .legend {
    position: fixed; bottom: 20px; left: 20px; z-index: 100;
    background: rgba(255,255,255,.95);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .legend-title { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ========== INFO PANEL ========== */
  .info-panel {
    position: fixed; top: 52px; right: 0; bottom: 0; z-index: 90;
    width: 360px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
    padding: 24px 20px 40px;
  }
  .info-panel.open { transform: translateX(0); }
  .info-close {
    position: absolute; top: 16px; right: 16px;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card);
    color: var(--muted); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .info-close:hover { color: var(--text); }
  .info-cat {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .info-title { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; }
  .info-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .info-divider { height: 1px; background: var(--border); margin: 16px 0; }
  .info-section-label {
    font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .info-point {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; line-height: 1.6;
    padding: 5px 0;
    border-bottom: 1px solid rgba(0,0,0,.07);
  }
  .info-point:last-child { border-bottom: none; }
  .info-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
  .info-link {
    display: block; margin-top: 20px;
    padding: 10px 16px; border-radius: 8px;
    border: 1px solid; text-align: center;
    font-size: 13px; text-decoration: none; font-weight: 600;
    transition: opacity .2s;
  }
  .info-link:hover { opacity: .8; }
  .info-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .info-tag {
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    background: rgba(0,0,0,.06);
    color: var(--text);
  }

  /* ========== CANVAS ========== */
  #canvas-wrap {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    cursor: grab;
  }
  #canvas-wrap:active { cursor: grabbing; }
  #canvas-wrap.panel-open { right: 360px; }

  svg#mm {
    width: 100%; height: 100%;
    user-select: none;
  }

  /* ========== SVG ELEMENTS ========== */
  .mm-center {
    cursor: default;
  }
  .mm-center circle {
    fill: #f0f5ff;
    stroke: var(--accent);
    stroke-width: 2.5;
    filter: drop-shadow(0 0 18px rgba(22,119,255,.25));
  }
  .mm-center text { fill: var(--text); font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

  .branch-group { cursor: pointer; }
  .branch-node circle {
    transition: r .2s, filter .2s;
  }
  .branch-node:hover circle {
    filter: drop-shadow(0 0 14px currentColor);
  }
  .branch-node.selected circle {
    stroke-width: 3;
    filter: drop-shadow(0 0 16px currentColor);
  }
  .branch-label {
    font-size: 13px; font-weight: 600;
    fill: var(--text);
    pointer-events: none;
    text-anchor: middle;
  }

  .leaf-group { cursor: pointer; }
  .leaf-box {
    rx: 8; ry: 8;
    transition: filter .2s;
  }
  .leaf-group:hover .leaf-box {
    filter: drop-shadow(0 0 8px rgba(0,0,0,.12));
  }
  .leaf-group.selected .leaf-box {
    stroke-width: 2;
  }
  .leaf-text {
    font-size: 11.5px;
    fill: var(--text);
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .leaf-num {
    font-size: 9px;
    fill: var(--muted);
    pointer-events: none;
    text-anchor: middle;
  }

  /* connector lines */
  .mm-line { fill: none; stroke-linecap: round; opacity: .65; }

  /* ========== MINI TOOLTIP ========== */
  .tooltip {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text);
    pointer-events: none;
    z-index: 200;
    display: none;
    white-space: nowrap;
  }

  /* zoom controls */
  .zoom-ctrl {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>

// SVG MIND MAP RENDERER
// =============================================
const svg = document.getElementById('mm');
const NS = 'http://www.w3.org/2000/svg';

let transform = { x: 0, y: 0, scale: 1 };
let dragging = false, lastMouse = null;
let selectedLeaf = null;
let mainG = null;

function init() {
  const w = svg.clientWidth || window.innerWidth;
  const h = svg.clientHeight || window.innerHeight;
  transform.x = w / 2;
  transform.y = h / 2;

  mainG = makeSVGEl('g');
  svg.appendChild(mainG);
  renderMap();
  applyTransform();
}

function makeSVGEl(tag, attrs = {}) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function makeText(content, x, y, cls, dy = 0) {
  const t = makeSVGEl('text', { x, y: y + dy, class: cls });
  const lines = content.split('\n');
  if (lines.length === 1) {
    t.textContent = content;
  } else {
    lines.forEach((line, i) => {
      const ts = makeSVGEl('tspan', { x, dy: i === 0 ? 0 : '1.2em' });
      ts.textContent = line;
      t.appendChild(ts);
    });
  }
  return t;
}

function cubicBezier(x1, y1, x2, y2, cx, cy) {
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}

function renderMap() {
  mainG.innerHTML = '';

  // Center node
  const center = makeSVGEl('g', { class: 'mm-center' });
  const cCircle = makeSVGEl('circle', { cx: 0, cy: 0, r: 68 });
  const cText1 = makeSVGEl('text', { x: 0, y: -10, 'font-size': '16', 'font-weight': '800', fill: '#1a202c', 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
  cText1.textContent = '眼科诊所';
  const cText2 = makeSVGEl('text', { x: 0, y: 10, 'font-size': '14', 'font-weight': '700', fill: '#64748b', 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
  cText2.textContent = '运营体系';
  const cText3 = makeSVGEl('text', { x: 0, y: 28, 'font-size': '11', fill: '#1677ff', 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
  cText3.textContent = '20大专项模块';
  center.appendChild(cCircle);
  center.appendChild(cText1);
  center.appendChild(cText2);
  center.appendChild(cText3);
  mainG.appendChild(center);

  // Branch radii
  const branchR = 230;
  const leafR = 120;
  const leafSpreadAngle = 65;

  CATEGORIES.forEach(cat => {
    const catAngle = cat.angle * Math.PI / 180;
    const bx = Math.cos(catAngle) * branchR;
    const by = Math.sin(catAngle) * branchR;

    // Line center → branch
    const lineC = makeSVGEl('path', {
      d: `M 0 0 Q ${bx * 0.5} ${by * 0.5} ${bx} ${by}`,
      class: 'mm-line',
      stroke: cat.color,
      'stroke-width': '2.5'
    });
    mainG.insertBefore(lineC, center);

    // Branch node
    const branchG = makeSVGEl('g', { class: 'branch-group' });
    const bCircle = makeSVGEl('circle', {
      cx: bx, cy: by, r: 38,
      fill: cat.color,
      opacity: '0.3',
      stroke: cat.color,
      'stroke-width': '1.5'
    });
    const bIcon = makeSVGEl('text', { x: bx, y: by - 8, 'font-size': '18', 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
    bIcon.textContent = cat.icon;
    const bLabel = makeSVGEl('text', { x: bx, y: by + 10, 'font-size': '12', 'font-weight': '700', fill: cat.color, 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
    bLabel.textContent = cat.label;
    branchG.appendChild(bCircle);
    branchG.appendChild(bIcon);
    branchG.appendChild(bLabel);
    mainG.appendChild(branchG);

    // Leaves
    const nLeaves = cat.modules.length;
    const spreadTotal = leafSpreadAngle * (nLeaves - 1);
    const startAngle = catAngle - spreadTotal / 2 * Math.PI / 180;

    cat.modules.forEach((mod, i) => {
      const leafAngle = startAngle + i * leafSpreadAngle * Math.PI / 180;

      // Distance depends on category angle to avoid overlap
      const dist = branchR + leafR + 30;
      const lx = Math.cos(leafAngle) * dist;
      const ly = Math.sin(leafAngle) * dist;

      // Leaf box
      const boxW = 90, boxH = 46;
      const leafGrp = makeSVGEl('g', {
        class: 'leaf-group',
        'data-mod': mod.id,
        'data-cat': cat.id
      });

      // Line branch → leaf
      const lineL = makeSVGEl('path', {
        d: `M ${bx} ${by} Q ${(bx + lx) / 2} ${(by + ly) / 2} ${lx} ${ly}`,
        class: 'mm-line',
        stroke: cat.color,
        'stroke-width': '1.5'
      });
      mainG.insertBefore(lineL, branchG);

      // Leaf rect
      const lRect = makeSVGEl('rect', {
        x: lx - boxW / 2, y: ly - boxH / 2,
        width: boxW, height: boxH,
        rx: 8, ry: 8,
        fill: cat.color,
        opacity: '0.22',
        stroke: cat.color,
        'stroke-width': '1',
        class: 'leaf-box'
      });

      // Badge num
      const lBadge = makeSVGEl('circle', {
        cx: lx - boxW / 2 + 10,
        cy: ly - boxH / 2 + 10,
        r: 9,
        fill: cat.color,
        opacity: '0.7'
      });
      const lNum = makeSVGEl('text', {
        x: lx - boxW / 2 + 10,
        y: ly - boxH / 2 + 10,
        'font-size': '8',
        'font-weight': '700',
        fill: '#fff',
        'text-anchor': 'middle',
        'dominant-baseline': 'middle'
      });
      lNum.textContent = mod.num;

      // Text (2 lines)
      const lines = mod.name.split('\n');
  const lText1 = makeSVGEl('text', {
        x: lx, y: ly - 8,
        'font-size': '11.5', 'font-weight': '600',
        fill: '#1a202c', 'text-anchor': 'middle', 'dominant-baseline': 'middle'
      });
  lText1.textContent = lines[0] || '';
  const lText2 = makeSVGEl('text', {
        x: lx, y: ly + 8,
        'font-size': '10.5', fill: '#64748b',
        'text-anchor': 'middle', 'dominant-baseline': 'middle'
      });
  lText2.textContent = lines[1] || '';

      leafGrp.appendChild(lRect);
      leafGrp.appendChild(lBadge);
      leafGrp.appendChild(lNum);
      leafGrp.appendChild(lText1);
      leafGrp.appendChild(lText2);

      leafGrp.addEventListener('click', (e) => {
        e.stopPropagation();
        selectLeaf(leafGrp, mod, cat);
      });

      leafGrp.addEventListener('mouseenter', (e) => {
        showTooltip(e, mod.name.replace('\n', ' ') + ' — ' + mod.subtitle);
      });
      leafGrp.addEventListener('mousemove', (e) => {
        moveTooltip(e);
      });
      leafGrp.addEventListener('mouseleave', hideTooltip);

      mainG.appendChild(leafGrp);
    });
  });
}

// PANEL

function selectLeaf(el, mod, cat) {
  // deselect previous
  if (selectedLeaf) {
    selectedLeaf.classList.remove('selected');
    const prevRect = selectedLeaf.querySelector('rect');
    if (prevRect) prevRect.setAttribute('opacity', '0.22');
  }

  el.classList.add('selected');
  const rect = el.querySelector('rect');
  if (rect) rect.setAttribute('opacity', '0.25');
  selectedLeaf = el;

  // fill panel
  document.getElementById('infoCat').style.color = cat.color;
  document.getElementById('infoCat').textContent = `${cat.icon} ${cat.label} / 模块 ${mod.num}`;
  document.getElementById('infoTitle').textContent = mod.name.replace('\n', ' ');
  document.getElementById('infoSubtitle').textContent = mod.subtitle;

  const tagsEl = document.getElementById('infoTags');
  tagsEl.innerHTML = mod.tags.map(t => `<span class="info-tag" style="color:${cat.color};background:${cat.color}30;">${t}</span>`).join('');

  const ptsEl = document.getElementById('infoPoints');
  ptsEl.innerHTML = mod.points.map(p =>
    `<div class="info-point">
      <div class="info-dot" style="background:${cat.color}"></div>
      <span>${p}</span>
    </div>`
  ).join('');

  const link = document.getElementById('infoLink');
  link.href = mod.file;
  link.style.borderColor = cat.color;
  link.style.color = cat.color;
  link.style.background = cat.color + '30';

  document.getElementById('infoPanel').classList.add('open');
  document.getElementById('canvas-wrap').classList.add('panel-open');
}

function closePanel() {
  document.getElementById('infoPanel').classList.remove('open');
  document.getElementById('canvas-wrap').classList.remove('panel-open');
  if (selectedLeaf) {
    selectedLeaf.classList.remove('selected');
    const rect = selectedLeaf.querySelector('rect');
    if (rect) rect.setAttribute('opacity', '0.22');
    selectedLeaf = null;
  }
}

svg.addEventListener('click', closePanel);

// =============================================
// DRAG & ZOOM
// =============================================
function applyTransform() {
  mainG.setAttribute('transform',
    `translate(${transform.x}, ${transform.y}) scale(${transform.scale})`
  );
}

const wrap = document.getElementById('canvas-wrap');

wrap.addEventListener('mousedown', (e) => {
  if (e.target.closest('.leaf-group')) return;
  dragging = true;
  lastMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  transform.x += dx;
  transform.y += dy;
  lastMouse = { x: e.clientX, y: e.clientY };
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; });

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  transform.x = mx - (mx - transform.x) * delta;
  transform.y = my - (my - transform.y) * delta;
  transform.scale *= delta;
  transform.scale = Math.max(0.3, Math.min(3, transform.scale));
  applyTransform();
}, { passive: false });

// Touch support
let touches = null;
wrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    dragging = true;
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else {
    touches = e.touches;
  }
}, { passive: true });
wrap.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastMouse.x;
    const dy = e.touches[0].clientY - lastMouse.y;
    transform.x += dx;
    transform.y += dy;
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    applyTransform();
  } else if (e.touches.length === 2 && touches) {
    const prev = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    const curr = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const delta = curr / prev;
    transform.scale *= delta;
    transform.scale = Math.max(0.3, Math.min(3, transform.scale));
    touches = e.touches;
    applyTransform();
  }
  e.preventDefault();
}, { passive: false });
wrap.addEventListener('touchend', () => { dragging = false; touches = null; });

function zoom(factor) {
  const w = svg.clientWidth;
  const h = svg.clientHeight;
  transform.x = w / 2 - (w / 2 - transform.x) * factor;
  transform.y = h / 2 - (h / 2 - transform.y) * factor;
  transform.scale *= factor;
  transform.scale = Math.max(0.3, Math.min(3, transform.scale));
  applyTransform();
}

function resetView() {
  const w = svg.clientWidth;
  const h = svg.clientHeight;
  transform.x = w / 2;
  transform.y = h / 2;
  transform.scale = 1;
  applyTransform();
  closePanel();
}

// =============================================
// TOOLTIP
// =============================================
const tip = document.getElementById('tooltip');
function showTooltip(e, text) {
  tip.textContent = text;
  tip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  tip.style.left = (e.clientX + 12) + 'px';
  tip.style.top = (e.clientY - 30) + 'px';
}
function hideTooltip() {
  tip.style.display = 'none';
}

  init();
  setTimeout(applyTransform, 100);
});
window.addEventListener('resize', () => {
  if (!dragging) resetView();
});
</script>
