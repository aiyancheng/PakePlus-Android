<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第10套 | 365天培训综合测试卷</title>
    <link rel="stylesheet" href="training-styles.css">
    <style>
        .exam-info { margin-bottom: 4px; }
        .exam-info p { margin-bottom: 10px; }
        .exam-badge {
            display: inline-block; margin: 8px 6px 0 0; padding: 4px 12px;
            background: #E6F0FF; color: #1677FF; border: 1px solid #D6E4FF;
            border-radius: 20px; font-size: 13px;
        }
        .score-display .score-text { white-space: pre-line; line-height: 1.7; }
        .reset-btn {
            display: inline-block; margin-left: 10px; padding: 10px 22px;
            background: #F5F5F5; color: #666; border: 1px solid #E0E0E0;
            border-radius: 10px; font-size: 15px; cursor: pointer;
            font-family: var(--font-family);
        }
        .reset-btn:hover { background: #EEE; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div class="day-number">模拟测试 · 第 10 套</div>
            <h1 class="page-title">365天培训综合测试卷（第10套）</h1>
            <div class="page-subtitle">共 20 题 · 每题 5 分 · 满分 100 分</div>
        </div>

        <div class="learning-card">
            <div class="card-header">
                <div class="card-icon">📝</div>
                <div class="card-title">考试说明</div>
            </div>
            <div class="learning-section exam-info">
                <p>1. 本试卷共 <strong>20</strong> 道选择题（含单选、多选），每题 <strong>5</strong> 分，满分 <strong>100</strong> 分。</p>
                <p>2. <strong>多选题</strong>须全部选对才得分，多选、少选、错选均不得分。</p>
                <p>3. 题目从 365 天课程题库中随机抽取，各套试卷题目互不重复。</p>
                <p>4. 作答完成后点击下方「📝 提交答案并评分」，系统自动评分并给出答题解析。</p>
                <div>
                    <span class="exam-badge">📚 题库总量 1000+ 题</span>
                    <span class="exam-badge">🎯 满分 100 分</span>
                    <span class="exam-badge">⏱ 建议用时 20 分钟</span>
                </div>
            </div>
        </div>

        <div class="practice-section">
            <div class="section-title">试 题</div>
            <div id="questionArea"></div>

            <div class="submit-area">
                <button class="submit-btn" onclick="submitExam()">📝 提交答案并评分</button>
                <button class="reset-btn" onclick="location.reload()">🔄 重新作答</button>
            </div>

            <div class="score-display" id="scoreDisplay">
                <div class="score-number" id="scoreNumber">0/100分</div>
                <div class="score-text" id="scoreText">本次测试成绩</div>
            </div>
        </div>

        <div class="nav-bottom">
            <a href="index.html" class="nav-home">🏠 返回首页</a>
        </div>
    </div>

    <div class="footer-support">
        技术支持：闫胜君视光工作室
    </div>

    <script>
        // ========== 本套试卷题目数据（随机抽取） ==========
        const examData = [{"src":101,"type":"single","text":"高峰期想要快速成交，最有效的策略是？","options":["把每种镜片的膜层原理都讲透，让顾客充分比较","优先推荐利润最高的定制片","优先推现货镜框+镜片，让顾客今天或明天就能取货","建议顾客周末人少时再来慢慢挑"],"answer":[2],"score":5,"explanation":"高峰期快速成交的关键是‘推现货’——优先推荐有现货的镜框+镜片，这样顾客能今天/明天取货，快速决策。如果推荐没现货的，要等3-5天，顾客可能犹豫或走人。"},{"src":286,"type":"multi","text":"转化犹豫型顾客关键法宝\"风险保障\"包括哪些措施？","options":["30天无忧换片服务","镜片一年质保","买一送一促销活动","免费镜框调整服务"],"answer":[0,1,3],"score":5,"explanation":"A、B、D都是有效的风险保障措施。C（买一送一促销）可能制造紧迫感，但对犹豫型顾客效果有限。"},{"src":340,"type":"single","text":"企业微信和钉钉的主要区别是什么？","options":["企业微信功能更强大，钉钉功能更简单","企业微信适合对外沟通（顾客用微信），钉钉适合内部管理（功能强大）","企业微信和钉钉完全一样，没区别","企业微信免费，钉钉收费"],"answer":[1],"score":5,"explanation":"企业微信的优势是与个人微信互通（顾客也在用微信），适合'对外沟通+对内协作'；钉钉的优势是功能强大（项目管理/审批流程/打卡/视频会议全产业链），适合'内部管理'。两者定位不同，不是谁好谁坏的问题。"},{"src":350,"type":"single","text":"电话应在铃响第几声内接听？","options":["第1声","第2-3声","第4声","第5声以后"],"answer":[1],"score":5,"explanation":"电话应在铃响第2-3声内接听。第1声太急（可能顾客还没准备好），第4声太慢（顾客开始焦虑）。"},{"src":116,"type":"single","text":"顾客要求\"异地配送\"给父母送礼，你应该特别注意什么？","options":["提醒顾客\"配送失败后惊喜感就没了\"，确认地址电话准确","直接邮寄，不用跟顾客确认","建议顾客\"还是自提吧，配送容易坏\"","告诉顾客\"异地配送要加钱，不如自提\""],"answer":[0],"score":5,"explanation":"A的回应最专业：提醒顾客确认地址电话准确，避免配送失败导致惊喜感消失。B太草率（容易配送失败），C和D太消极（拒绝了顾客的合理需求）。"},{"src":101,"type":"single","text":"高峰期顾客抱怨\"怎么等这么久？\"，最佳回应是？","options":["‘真不好意思让您久等了！我帮您优先安排。’（先道歉，再立即行动）","‘没办法，今天人多。’（只给理由，不给解决方案）","‘你嫌差别来。’（与顾客对抗）","不作回应，继续做手上的事"],"answer":[0],"score":5,"explanation":"高峰期顾客抱怨‘怎么等这么久’，正确回应是‘真不好意思让您久等了！我帮您优先安排...’（道歉+立即行动）。错误回应是‘没办法，今天人多’（只给理由，不给解决方案）或‘你嫌差别来’（对抗）。"},{"src":174,"type":"single","text":"销售演练的核心价值是？","options":["提升应变能力、发现知识盲点、增强自信心","完成任务、走过场、应付检查","表演给别人看、展示自己多厉害","纯粹浪费时间、不如直接去卖眼镜"],"answer":[0],"score":5,"explanation":"销售演练的核心价值是将理论知识转化为实战能力：提升应变能力、发现知识盲点、增强自信心。"},{"src":197,"type":"single","text":"远视性弱视最常见于哪个年龄段？","options":["0-1岁","3-6岁","12-18岁","18岁以上"],"answer":[1],"score":5,"explanation":"3-6岁是弱视治疗的黄金期（关键期），此时期视觉系统可塑性最强，治疗效果最好。"},{"src":137,"type":"single","text":"赠品策略的核心是？","options":["便宜处理库存","提升感知价值，让顾客觉得\"占了便宜\"","清理滞销赠品","完成销售指标"],"answer":[1],"score":5,"explanation":"赠品策略核心是\"提升感知价值\"，让顾客觉得\"占了便宜\"，从而更愿意买单。"},{"src":209,"type":"single","text":"下列关于20-20-20法则的说法，哪个是正确的？","options":["看手机就是休息，因为手机屏幕比较小","闭眼就能完全放松眼睛，不需要看远处","只有儿童和青少年需要执行，成年人不需要","必须看6米外的物体，单纯闭眼或看近处都不能代替"],"answer":[3],"score":5,"explanation":"必须看6米外的物体，单纯闭眼或看近处（如手机）都不能代替远眺。A错（看手机仍是近距离）；B错（闭眼不能放松调节）；C错（成年人也需要）。"},{"src":241,"type":"single","text":"顾客准备验配OK镜，地形图检查发现局部红色区域（>50D），验光师应如何处理？","options":["继续验配OK镜，地形图异常可能是测量误差","立即停止验配，转诊角膜专科进一步检查","让顾客换一副软性隐形眼镜戴","先配框架眼镜，半年后再看地形图"],"answer":[1],"score":5,"explanation":"地形图红色区域提示圆锥角膜可能，是OK镜绝对禁忌症。必须立即停止验配并转诊角膜专科，延误可能导致角膜穿孔等严重后果。"},{"src":126,"type":"single","text":"顾客说\"我平时上班用电脑多，周末喜欢开车兜风\"，应该如何推荐镜片？","options":["推荐普通单光镜片","推荐防蓝光+变色镜片（多功能）","推荐纯钛镜框","不推荐，让他自己选"],"answer":[1],"score":5,"explanation":"上班用电脑多→防蓝光，周末开车→变色（室内透明室外深色）或偏光。推荐多功能镜片（防蓝光+变色）最合适。"},{"src":227,"type":"single","text":"儿童镜框材质的选择，以下哪项是最佳推荐？","options":["钛合金镜框，轻便有档次","TR90材质镜框，柔韧安全","普通金属镜框，价格实惠","板材镜框，色彩丰富"],"answer":[1],"score":5,"explanation":"TR90材质超轻、柔韧、耐撞击，是儿童镜框的首选。钛合金虽轻但价格高且断裂风险存在；普通金属含镍易过敏；板材较重且易断。"},{"src":235,"type":"single","text":"老年人镜框的首选材质是？","options":["板材镜框，颜色丰富好看","纯钛镜框，最轻最舒适","普通金属镜框，价格实惠","TR90镜框，弹力好"],"answer":[1],"score":5,"explanation":"纯钛镜框（8-12g）是所有材质中最轻的，久戴不累，是老年镜框的首选。β钛次之。"},{"src":209,"type":"multi","text":"20-20-20法则的科学原理包括以下哪些？","options":["放松睫状肌，缓解调节疲劳","促进泪膜重新分布，缓解干眼","平衡眼外肌，减轻集合负担","增加视网膜血流量，改善营养"],"answer":[0,1,2],"score":5,"explanation":"20-20-20法则的原理包括：放松睫状肌（A）、修复泪膜（B）、平衡眼外肌（C）。D选项（增加视网膜血流量）不是主要原理。"},{"src":9,"type":"single","text":"非球面镜片特别适合哪种人群？","options":["极低度数（-0.50D以下）","高度数近视（-6.00D以上）","老花眼","儿童"],"answer":[1],"score":5,"explanation":"非球面镜片特别适合高度数近视（-6.00D以上）顾客，因为度数越高，球面缺陷越明显，非球面改善效果越显著。"},{"src":351,"type":"multi","text":"关于电梯迎送礼仪，以下说法正确的有？","options":["电梯内可以玩手机，不理顾客","电梯开门时，应用手挡门防止夹到顾客","与顾客同乘电梯，应站控制面板旁","电梯送宾时，应目送电梯门完全关闭"],"answer":[1,2,3],"score":5,"explanation":"A错误：电梯内玩手机不理顾客是禁忌。B正确：手挡门是安全礼仪。C正确：站控制面板旁方便操作。D正确：目送电梯门关闭是基本礼仪。"},{"src":138,"type":"multi","text":"关于取镜时间预期管理，以下做法正确的是？","options":["实际3天，告诉顾客\"3-5天\"，留有余地","实际5天，告诉顾客\"3天\"，让顾客期待更高","明确取镜日期，并说\"延误会提前通知\"","不告知取镜时间，让顾客\"随时来问\""],"answer":[0,2],"score":5,"explanation":"A（留余地）和C（明确日期+延误通知）正确。B（夸大承诺）和D（不告知）错误。"},{"src":203,"type":"single","text":"正常眼压范围是？","options":["5-10 mmHg","10-21 mmHg","21-30 mmHg",">30 mmHg"],"answer":[1],"score":5,"explanation":"正常眼压范围为10-21 mmHg，但存在个体差异，部分正常眼压性青光眼患者眼压在正常范围内。"},{"src":266,"type":"single","text":"视力健康咨询六步法中，\"需求问诊\"的主要目标是什么？","options":["快速完成验光检查","了解顾客主诉、用眼场景和历史配镜情况","向顾客推荐产品","建立健康档案"],"answer":[1],"score":5,"explanation":"需求问诊的核心目标是了解顾客的主要症状、用眼场景和历史配镜情况，为后续验光和方案制定提供依据。"}];
        const LETTERS = 'ABCDEFGH';

        // ========== 渲染试题 ==========
        function renderExam() {
            const area = document.getElementById('questionArea');
            examData.forEach((q, qi) => {
                const box = document.createElement('div');
                box.className = 'choice-question';

                const qt = document.createElement('div');
                qt.className = 'question-text';
                qt.textContent = (qi + 1) + '. ' + q.text + (q.type === 'multi' ? '（多选）' : '');
                box.appendChild(qt);

                const meta = document.createElement('div');
                meta.className = 'question-meta';
                meta.textContent = (q.type === 'multi' ? '多选题' : '单选题') + ' · ' + q.score + '分';
                box.appendChild(meta);

                const ul = document.createElement('ul');
                ul.className = 'options-list';
                q.options.forEach((opt, oi) => {
                    const li = document.createElement('li');
                    li.className = 'option-item';
                    const mk = document.createElement('div');
                    mk.className = 'option-marker';
                    mk.textContent = LETTERS[oi];
                    const tx = document.createElement('span');
                    tx.className = 'option-text';
                    tx.textContent = opt;
                    li.appendChild(mk);
                    li.appendChild(tx);
                    li.addEventListener('click', () => toggleOption(qi, oi, q.type === 'multi'));
                    ul.appendChild(li);
                });
                box.appendChild(ul);

                const fb = document.createElement('div');
                fb.className = 'feedback';
                box.appendChild(fb);

                area.appendChild(box);
            });
        }

        function toggleOption(qi, oi, isMulti) {
            const box = document.querySelectorAll('.choice-question')[qi];
            const items = box.querySelectorAll('.option-item');
            const item = items[oi];
            if (isMulti) {
                item.classList.toggle('selected');
            } else {
                items.forEach(li => li.classList.remove('selected'));
                item.classList.add('selected');
            }
        }

        function getSelected(qi) {
            const box = document.querySelectorAll('.choice-question')[qi];
            const items = box.querySelectorAll('.option-item');
            const sel = [];
            items.forEach((li, i) => { if (li.classList.contains('selected')) sel.push(i); });
            return sel.sort((a, b) => a - b);
        }

        // ========== 自动评分 ==========
        function submitExam() {
            let total = 0, correctCount = 0, answered = 0;
            examData.forEach((q, qi) => {
                const box = document.querySelectorAll('.choice-question')[qi];
                const items = box.querySelectorAll('.option-item');
                const sel = getSelected(qi);
                if (sel.length) answered++;
                const corr = q.answer.slice().sort((a, b) => a - b);
                const ok = JSON.stringify(sel) === JSON.stringify(corr);

                items.forEach(li => li.classList.remove('correct', 'wrong'));
                const fb = box.querySelector('.feedback');
                fb.classList.remove('show', 'correct-feedback', 'wrong-feedback');
                items.forEach((li, oi) => {
                    if (corr.includes(oi)) li.classList.add('correct');
                    if (sel.includes(oi) && !corr.includes(oi)) li.classList.add('wrong');
                });

                if (ok) {
                    total += q.score;
                    correctCount++;
                    fb.classList.add('correct-feedback', 'show');
                    fb.innerHTML = '✅ 回答正确！' + (q.explanation || '') + '  <em>（出自第' + q.src + '天）</em>';
                } else {
                    const letters = corr.map(i => LETTERS[i]).join('、');
                    fb.classList.add('wrong-feedback', 'show');
                    fb.innerHTML = '❌ 回答错误。正确答案：<strong>' + letters + '</strong>。' + (q.explanation || '') + '  <em>（出自第' + q.src + '天）</em>';
                }
            });

            const max = examData.reduce((s, q) => s + q.score, 0);
            const pct = Math.round(total / max * 100);
            let result, tip;
            if (pct >= 90) { result = '🏆 优秀！知识掌握非常扎实'; }
            else if (pct >= 80) { result = '👍 良好，继续巩固即可'; }
            else if (pct >= 60) { result = '✅ 合格，请重点复习错题'; }
            else { result = '⚠️ 不合格，建议回看相关课程后重新测试'; }
            tip = (answered < examData.length ? '（有 ' + (examData.length - answered) + ' 题未作答）' : '（已全部作答）');

            document.getElementById('scoreNumber').textContent = total + '/' + max + '分';
            document.getElementById('scoreText').innerHTML =
                result + '\n答对 ' + correctCount + '/' + examData.length + ' 题 · 正确率 ' + pct + '% ' + tip;

            const disp = document.getElementById('scoreDisplay');
            disp.classList.add('show');
            disp.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        window.addEventListener('DOMContentLoaded', renderExam);
    </script>
</body>
</html>
