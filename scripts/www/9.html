
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基于VAK学习风格模型的专业感官学习风格自测工具，由永州爱眼城提供护眼建议">
    <meta name="theme-color" content="#2c3e50">
    <title>感官学习风格交互式自测 | 永州爱眼城</title>
    <style>
        :root {
            --color-primary: #4A6CF7;
            --color-primary-dark: #3651d5;
            --color-visual: #4A90D9;
            --color-visual-light: #e8f1fb;
            --color-visual-border: #4A90D9;
            --color-auditory: #E8734A;
            --color-auditory-light: #fdf0ea;
            --color-auditory-border: #E8734A;
            --color-kinesthetic: #3CB371;
            --color-kinesthetic-light: #edf8f2;
            --color-kinesthetic-border: #3CB371;
            --color-mix: #7B68EE;
            --color-bg: #f0f4f8;
            --color-card: #ffffff;
            --color-text: #2c3e50;
            --color-text-secondary: #5a6c7d;
            --color-border: #e2e8f0;
            --color-warning-bg: #fffbeb;
            --color-warning-border: #f59e0b;
            --color-warning-text: #92400e;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.10);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
            --shadow-hover: 0 8px 25px rgba(0, 0, 0, 0.13);
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(160deg, #eef2f7 0%, #dce3ed 30%, #e8ecf3 60%, #f0f4f8 100%);
            background-attachment: fixed;
            padding: 20px;
            line-height: 1.6;
            font-family: var(--font-sans);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--color-card);
            padding: 0;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            animation: containerEnter 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }

        @keyframes containerEnter {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 顶部品牌头 ========== */
        .brand-header {
            text-align: center;
            padding: 28px 30px 24px;
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 40%, #2c3e50 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .brand-header::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .brand-header::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .brand-header .brand-icon {
            font-size: 42px;
            margin-bottom: 6px;
            display: block;
            position: relative;
            z-index: 1;
        }
        .brand-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
            margin: 0;
        }
        .brand-header .brand-subtitle {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        /* ========== 主体内容区 ========== */
        .main-content {
            padding: 28px 30px 10px;
        }

        .section-intro {
            text-align: center;
            margin-bottom: 24px;
        }
        .section-intro h2 {
            font-size: 22px;
            color: #1a252f;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .section-intro .intro-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            letter-spacing: 0.3px;
        }

        /* 进度指示器 */
        .progress-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 18px;
            background: #f8fafc;
            border-radius: 30px;
            font-size: 13px;
            color: var(--color-text-secondary);
            font-weight: 500;
        }
        .progress-indicator .dot-pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--color-primary);
            animation: dotPulse 1.6s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.8);
                opacity: 1;
            }
        }
        .progress-indicator .answered-count {
            font-weight: 700;
            color: var(--color-primary);
            font-size: 15px;
        }

        /* ========== 题目卡片 ========== */
        .q-item {
            margin: 0 0 16px;
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: #fafbfc;
            border: 1.5px solid transparent;
            border-left: 4px solid var(--color-border);
            transition: all var(--transition-smooth);
            position: relative;
            cursor: default;
        }
        .q-item:hover {
            border-color: #dde4f0;
            box-shadow: var(--shadow-sm);
            background: #fdfefe;
        }
        .q-item.answered {
            border-left-color: var(--color-primary);
            border-color: #dce6f8;
            background: #fdfeff;
            box-shadow: var(--shadow-sm);
        }
        .q-item .q-number {
            display: inline-block;
            background: #e8ecf2;
            color: #5a6c7d;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            transition: all var(--transition-fast);
        }
        .q-item.answered .q-number {
            background: #dce6f8;
            color: var(--color-primary);
        }
        .q-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a252f;
            font-size: 16px;
            line-height: 1.5;
        }
        .option {
            margin: 8px 0;
            cursor: pointer;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1.5px solid transparent;
            background: #fff;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        .option:hover {
            background: #eef3fb;
            border-color: #d0ddf2;
            transform: translateX(3px);
        }
        .option:active {
            transform: scale(0.985);
            transition: transform 0.1s ease;
        }
        .option.selected {
            background: #e6f0ff;
            border-color: #b3cff5;
            box-shadow: inset 0 0 0 1px rgba(74, 108, 247, 0.15);
            font-weight: 500;
        }
        .option .opt-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #eef1f6;
            font-weight: 700;
            font-size: 13px;
            color: #5a6c7d;
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }
        .option.selected .opt-letter {
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.3);
        }
        .option .opt-text {
            flex: 1;
            font-size: 15px;
            color: #3a4d5e;
        }
        .option.selected .opt-text {
            color: #1a2d40;
        }
        input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }
        .option .radio-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #c5cdd8;
            flex-shrink: 0;
            transition: all var(--transition-fast);
            position: relative;
            background: #fff;
        }
        .option.selected .radio-dot {
            border-color: var(--color-primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.12);
        }
        .option.selected .radio-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-primary);
            animation: radioPop 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes radioPop {
            from {
                transform: translate(-50%, -50%) scale(0);
            }
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* ========== 按钮区 ========== */
        .btn-box {
            text-align: center;
            padding: 10px 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        #submitBtn {
            padding: 15px 48px;
            background: linear-gradient(135deg, #4A6CF7 0%, #3651d5 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            box-shadow: 0 6px 22px rgba(74, 108, 247, 0.35);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            font-family: var(--font-sans);
        }
        #submitBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 108, 247, 0.45);
        }
        #submitBtn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(74, 108, 247, 0.3);
            transition: all 0.1s ease;
        }
        #submitBtn:disabled {
            background: #c5cdd8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.7;
        }
        #submitBtn .btn-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: ripple 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        #resetBtn {
            padding: 10px 24px;
            background: transparent;
            color: #7a8ea0;
            border: 1.5px solid #dde4ed;
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: var(--font-sans);
            letter-spacing: 0.3px;
        }
        #resetBtn:hover {
            border-color: #b0bec5;
            color: #4a5e6e;
            background: #fafbfc;
        }

        /* ========== 结果区 ========== */
        #result {
            margin: 0 30px 30px;
            padding: 26px 28px;
            border-radius: var(--radius-lg);
            background: #fdfeff;
            border: 1.5px solid #e8eef5;
            display: none;
            animation: resultReveal 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;
            box-shadow: var(--shadow-md);
        }
        @keyframes resultReveal {
            from {
                opacity: 0;
                transform: translateY(24px);
                filter: blur(2px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        .res-type-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .badge-visual {
            background: var(--color-visual-light);
            color: #2a5d8f;
        }
        .badge-auditory {
            background: var(--color-auditory-light);
            color: #9b4a2a;
        }
        .badge-kinesthetic {
            background: var(--color-kinesthetic-light);
            color: #1e6b42;
        }
        .badge-mix {
            background: #f3f0ff;
            color: #4a3a9e;
        }
        .res-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a252f;
            margin: 6px 0 16px;
            line-height: 1.3;
        }
        .res-desc {
            color: #4a5e6e;
            line-height: 1.85;
            font-size: 15px;
        }
        .res-desc strong {
            color: #1a252f;
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 15px;
            letter-spacing: 0.3px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .res-desc .highlight-box {
            display: block;
            background: #f8fafc;
            border-left: 3px solid var(--color-primary);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin: 8px 0 14px;
            color: #3a4d5e;
            font-size: 14px;
            line-height: 1.85;
        }
        .res-desc .highlight-box b {
            color: #1a252f;
        }
        .tips-content b {
            color: #92400e;
        }

        /* ========== 统计卡片 ========== */
        .stats-box {
            margin-top: 22px;
            padding: 20px 18px;
            background: #f8fafc;
            border-radius: var(--radius-md);
            border: 1px solid #eef2f7;
        }
        .stats-title {
            font-weight: 700;
            margin-bottom: 16px;
            color: #1a252f;
            text-align: center;
            font-size: 15px;
            letter-spacing: 0.3px;
        }
        .stats-cards {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 16px;
        }
        .stat-item {
            flex: 1;
            min-width: 90px;
            max-width: 140px;
            text-align: center;
            padding: 14px 10px;
            background: #fff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-fast);
        }
        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .stat-item .stat-icon {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }
        .stat-item .stat-label {
            font-size: 12px;
            color: #7a8ea0;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .stat-item .stat-value {
            font-weight: 700;
            font-size: 22px;
            color: #1a252f;
            margin: 2px 0;
        }
        .stat-item.visual-stat {
            border-top: 3px solid var(--color-visual-border);
        }
        .stat-item.audio-stat {
            border-top: 3px solid var(--color-auditory-border);
        }
        .stat-item.touch-stat {
            border-top: 3px solid var(--color-kinesthetic-border);
        }

        /* 条形图 */
        .bar-chart {
            margin-top: 10px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }
        .bar-label {
            width: 56px;
            font-size: 12px;
            font-weight: 600;
            color: #5a6c7d;
            text-align: right;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: #e8ecf2;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.22, 0.61, 0.36, 1);
            position: relative;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .bar-fill.visual-bar {
            background: linear-gradient(90deg, #5ba0e0, #4A90D9);
        }
        .bar-fill.auditory-bar {
            background: linear-gradient(90deg, #f08a64, #E8734A);
        }
        .bar-fill.kinesthetic-bar {
            background: linear-gradient(90deg, #5cc98a, #3CB371);
        }
        .bar-percent {
            font-size: 13px;
            font-weight: 700;
            color: #3a4d5e;
            width: 42px;
            text-align: left;
            flex-shrink: 0;
        }

        /* ========== 护眼建议区 ========== */
        .tips-section {
            margin-top: 20px;
            padding: 18px 20px;
            background: var(--color-warning-bg);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--color-warning-border);
            position: relative;
        }
        .tips-title {
            font-weight: 700;
            color: var(--color-warning-text);
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tips-content {
            color: #6b4d1e;
            font-size: 14px;
            line-height: 1.7;
        }

        /* ========== 页脚品牌 ========== */
        .footer-brand {
            text-align: center;
            padding: 16px 30px;
            background: #f5f7fa;
            color: #7a8ea0;
            font-size: 13px;
            letter-spacing: 0.3px;
            border-top: 1px solid #eef2f7;
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        }
        .footer-brand strong {
            color: #4a5e6e;
        }

        /* ========== 底部翻页导航 ========== */
        .page-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 0 30px 24px;
            flex-wrap: wrap;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 22px;
            background-color: #1a6dcc;
            color: #fff !important;
            text-decoration: none !important;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 500;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            flex: 1;
            min-width: 160px;
            text-align: center;
        }
        .nav-btn:hover {
            background-color: #0d4d9c;
            transform: translateY(-2px);
        }
        @media (max-width: 640px) {
            .page-nav { margin: 0 14px 16px; flex-direction: column; gap: 10px; }
            .nav-btn { width: 100%; }
        }

        /* ========== Toast提示 ========== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #1a252f;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            letter-spacing: 0.3px;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.warning {
            background: #e8734a;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            body {
                padding: 8px;
            }
            .container {
                border-radius: var(--radius-lg);
            }
            .brand-header {
                padding: 20px 16px 18px;
            }
            .brand-header h1 {
                font-size: 21px;
            }
            .brand-header .brand-icon {
                font-size: 32px;
            }
            .main-content {
                padding: 18px 14px 6px;
            }
            .section-intro h2 {
                font-size: 18px;
            }
            .q-item {
                padding: 14px 12px;
                margin-bottom: 10px;
            }
            .q-title {
                font-size: 15px;
            }
            .option {
                padding: 10px 10px;
                gap: 6px;
            }
            .option .opt-letter {
                width: 24px;
                height: 24px;
                font-size: 11px;
            }
            .option .opt-text {
                font-size: 13px;
            }
            .option .radio-dot {
                width: 16px;
                height: 16px;
            }
            #submitBtn {
                padding: 13px 32px;
                font-size: 15px;
                border-radius: 26px;
            }
            #result {
                margin: 0 12px 20px;
                padding: 18px 14px;
            }
            .res-title {
                font-size: 19px;
            }
            .res-desc {
                font-size: 14px;
            }
            .stats-cards {
                gap: 6px;
            }
            .stat-item {
                min-width: 70px;
                padding: 10px 6px;
            }
            .stat-item .stat-value {
                font-size: 18px;
            }
            .bar-label {
                width: 40px;
                font-size: 10px;
            }
            .bar-percent {
                width: 32px;
                font-size: 11px;
            }
            .footer-brand {
                padding: 12px 14px;
                font-size: 11px;
                border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            }
            .btn-box {
                padding: 8px 14px 20px;
                gap: 8px;
            }
        }
        @media (max-width: 380px) {
            .stats-cards {
                flex-direction: column;
                align-items: stretch;
            }
            .stat-item {
                max-width: none;

                const total = countVisual + countAuditory + countKinesthetic;
                const visualPercent = Math.round((countVisual / total) * 100);
                const auditoryPercent = Math.round((countAuditory / total) * 100);
                const kinestheticPercent = Math.round((countKinesthetic / total) * 100);

                // 判断主导类型
                const maxVal = Math.max(countVisual, countAuditory, countKinesthetic);
                const maxTypes = [];
                if (countVisual === maxVal) maxTypes.push(TYPE_VISUAL);
                if (countAuditory === maxVal) maxTypes.push(TYPE_AUDITORY);
                if (countKinesthetic === maxVal) maxTypes.push(TYPE_KINESTHETIC);

                let resultType;
                if (maxTypes.length >= 2) {
                    resultType = TYPE_MIX;
                } else if (maxTypes[0] === TYPE_VISUAL) {
                    resultType = TYPE_VISUAL;
                } else if (maxTypes[0] === TYPE_AUDITORY) {
                    resultType = TYPE_AUDITORY;
                } else {
                    resultType = TYPE_KINESTHETIC;
                }

                // 填充结果
                const info = typeInfo[resultType];
                document.getElementById('resultBadge').textContent = info.badgeText;
                document.getElementById('resultBadge').className = 'res-type-badge ' + info.badgeClass;
                document.getElementById('resultTitle').textContent = info.title;
                document.getElementById('resultDesc').innerHTML = info.desc;
                document.getElementById('countVisual').textContent = countVisual;
                document.getElementById('countAuditory').textContent = countAuditory;
                document.getElementById('countKinesthetic').textContent = countKinesthetic;
                document.getElementById('visualPercentLabel').textContent = visualPercent + '%';
                document.getElementById('auditoryPercentLabel').textContent = auditoryPercent + '%';
                document.getElementById('kinestheticPercentLabel').textContent = kinestheticPercent + '%';
                document.getElementById('tipsContent').innerHTML = info.eyeCare;

                // 显示结果
                resultDom.style.display = 'block';
                isSubmitted = true;
                submitBtn.disabled = true;
                submitBtn.style.background = '#c5cdd8';
                submitBtn.style.boxShadow = 'none';
                submitBtn.textContent = '✅ 已完成测试';

                // 动画延迟——条形图展开
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        document.getElementById('visualBar').style.width = visualPercent + '%';
                        document.getElementById('visualBar').textContent = visualPercent > 8 ? visualPercent +
                            '%' : '';
                        document.getElementById('auditoryBar').style.width = auditoryPercent + '%';
                        document.getElementById('auditoryBar').textContent = auditoryPercent > 8 ? auditoryPercent +
                            '%' : '';
                        document.getElementById('kinestheticBar').style.width = kinestheticPercent + '%';
                        document.getElementById('kinestheticBar').textContent = kinestheticPercent > 8 ?
                            kinestheticPercent + '%' : '';
                    });
                });

                // 平滑滚动到结果
                setTimeout(() => {
                    resultDom.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 150);

                // 显示完成提示
                showToast('🎉 测试完成！查看你的专属分析报告');
            });

            // ==================== 重置按钮 ====================
            resetBtn.addEventListener('click', function() {
                if (isSubmitted || Object.keys(userSelections).length > 0) {
                    // 清除所有选择
                    for (const key in userSelections) {
                        delete userSelections[key];
                    }
                    // 清除UI选中状态
                    document.querySelectorAll('.option.selected').forEach(opt => opt.classList.remove(
                        'selected'));
                    document.querySelectorAll('.option[aria-checked="true"]').forEach(opt => opt.setAttribute(
                        'aria-checked', 'false'));
                    document.querySelectorAll('.q-item.answered').forEach(item => item.classList.remove(
                    'answered'));
                    // 重置结果区域
                    resultDom.style.display = 'none';
                    document.getElementById('visualBar').style.width = '0%';
                    document.getElementById('visualBar').textContent = '0%';
                    document.getElementById('auditoryBar').style.width = '0%';
                    document.getElementById('auditoryBar').textContent = '0%';
                    document.getElementById('kinestheticBar').style.width = '0%';
                    document.getElementById('kinestheticBar').textContent = '0%';
                    // 重置按钮状态
                    isSubmitted = false;
                    submitBtn.disabled = true;
                    submitBtn.style.background = 'linear-gradient(135deg, #4A6CF7, #3651d5)';
                    submitBtn.style.boxShadow = '0 6px 22px rgba(74,108,247,0.35)';
                    submitBtn.textContent = '📝 提交答卷 · 查看专属分析';
                    // 更新进度
                    updateProgress();
                    progressIndicator.querySelector('.dot-pulse').style.background = 'var(--color-primary)';
                    // 滚动到顶部
                    document.querySelector('.main-content').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    showToast('已重置，请重新作答');
                }
            });

            // ==================== 键盘导航支持 ====================
            document.addEventListener('keydown', function(e) {
                const activeEl = document.activeElement;
                if (!activeEl || !activeEl.classList.contains('option')) return;

                const qIndex = parseInt(activeEl.getAttribute('data-qindex'));
                if (isNaN(qIndex)) return;

                const qItemDom = document.getElementById('qItem' + qIndex);
                if (!qItemDom) return;
                const options = Array.from(qItemDom.querySelectorAll('.option'));
                const currentIdx = options.indexOf(activeEl);

                if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    const nextIdx = (currentIdx + 1) % options.length;
                    options[nextIdx].focus();
                } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    const prevIdx = (currentIdx - 1 + options.length) % options.length;
                    options[prevIdx].focus();
                } else if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const typeValue = activeEl.getAttribute('data-type');
                    window._selectOption(qIndex, typeValue, activeEl);
                }
            });

            // ==================== 初始化 ====================
            function init() {
                renderAllQuestions();
                updateProgress();
                submitBtn.disabled = true;
                resultDom.style.display = 'none';
                isSubmitted = false;
                // 清空选择记录
                for (const key in userSelections) {
                    delete userSelections[key];
                }
                document.getElementById('visualBar').style.width = '0%';
                document.getElementById('visualBar').textContent = '0%';
                document.getElementById('auditoryBar').style.width = '0%';
                document.getElementById('auditoryBar').textContent = '0%';
                document.getElementById('kinestheticBar').style.width = '0%';
                document.getElementById('kinestheticBar').textContent = '0%';
            }

            init();

            console.log('%c感官学习风格交互式自测已就绪 %c| %c永州爱眼城',
                'font-weight:bold;color:#2c3e50;',
                '',
                'color:#4A90D9;');
            console.log('%c基于VAKT学习风格模型 · 15道情景题 · 支持键盘导航',
                'color:#5a6c7d;font-size:12px;');
        })();
    </script>
</body>
